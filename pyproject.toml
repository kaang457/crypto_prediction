[project]
name = "btcforecast"
version = "2.0.0"
description = "Next-day Bitcoin forecasting with gold and Brent crude features, evaluated walk-forward against a random-walk baseline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "requests>=2.32",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
btcforecast = "btcforecast.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
